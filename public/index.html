<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velor Interview</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one calm column. Header strip, brief card, interview feed, sticky composer. Owner sees a panel of briefs and answers. */
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --ink:#1B1915; --muted:#6E685C; --line:#E4DDCD;
  --gold:#B8862A; --gold-soft:#F3E7CC; --gold-ink:#5C4210; --ok:#2E7D4F; --warn:#A5531B;
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E0C; --surface:#191714; --ink:#F1ECE2; --muted:#9C9487; --line:#2C2924;
    --gold:#D6A13D; --gold-soft:#2A2213; --gold-ink:#F0D9A6; --ok:#5BBE86; --warn:#E39456;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E0C; --surface:#191714; --ink:#F1ECE2; --muted:#9C9487; --line:#2C2924;
  --gold:#D6A13D; --gold-soft:#2A2213; --gold-ink:#F0D9A6; --ok:#5BBE86; --warn:#E39456;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.mark{font:600 18px/1 var(--display);letter-spacing:.32em;color:var(--gold)}
.sub{font-size:13px;color:var(--muted);letter-spacing:.04em}
.hdr-actions{display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1406;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{flex:1;padding:26px 0 0;display:flex;flex-direction:column;gap:18px}
h1{font:500 22px/1.3 var(--display);margin:0;text-wrap:balance}
h2{font:500 15px/1.3 var(--display);margin:0;letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip.gold{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.feed{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.msg{max-width:88%;white-space:pre-wrap;word-wrap:break-word;animation:rise .25s ease both}
.msg.ai{align-self:flex-start;border-left:2px solid var(--gold);padding:2px 0 2px 14px}
.msg.me{align-self:flex-end;background:var(--gold-soft);color:var(--ink);border-radius:14px 14px 4px 14px;padding:10px 14px}
.msg .who{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.typing{color:var(--muted);font-size:14px}
@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.msg{animation:none}}
.composer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 78%,transparent);padding:14px 0 18px;display:flex;flex-direction:column;gap:10px}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
textarea{flex:1;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;min-height:48px;max-height:220px;padding:8px}
textarea::placeholder{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.row .left,.row .right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:12px;color:var(--muted)}
.mic.on{border-color:var(--warn);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=text],select,.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.field{min-height:160px;resize:vertical}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600}
pre.tx{white-space:pre-wrap;font:14px/1.5 var(--body);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
a{color:var(--gold)}
@media (max-width:480px){.msg{max-width:100%}h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="mark">VELOR</span><span class="sub" id="hdrSub">Interview</span></div>
    <div class="hdr-actions">
      <button class="btn ghost" id="themeBtn" type="button" aria-label="Theme">◐</button>
    </div>
  </header>
  <main id="view"><section class="card"><p class="note">Загружаю…</p></section></main>
</div>
<script>
(function(){
"use strict";
const rootEl=document.documentElement;
try{const t=localStorage.getItem("velor-theme"); if(t) rootEl.setAttribute("data-theme",t);}catch(e){}
document.getElementById("themeBtn").addEventListener("click",()=>{
  const cur=rootEl.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark"; rootEl.setAttribute("data-theme",nx);
  try{localStorage.setItem("velor-theme",nx);}catch(e){}
});

const T={
  ru:{you:"Вы",ai:"Интервьюер",start:"Начать интервью",send:"Отправить",finish:"Завершить интервью",coverage:"Покажи покрытие",
    placeholder:"Ответьте своими словами. Можно надиктовать.",intro:"Это подготовительное интервью для сценария вашего видео. Я задаю по одному короткому вопросу и выбираю следующий по вашему ответу. Отвечайте как удобно, неровные формулировки нормальны. Обычно это 20-30 минут.",
    saved:"Ответы сохраняются автоматически",copy:"Скопировать ответы",copied:"Скопировано",thinking:"Думаю над следующим вопросом…",
    done:"Спасибо! Интервью завершено, ответы переданы команде Velor.",err:"Не получилось получить ответ. Попробуйте ещё раз через минуту.",
    retry:"Повторить",micStart:"Диктовать",micStop:"Стоп",confirmFinish:"Завершить интервью? Продолжить потом будет нельзя.",yes:"Да, завершить",no:"Продолжить",
    missing:"Интервью по этой ссылке не найдено. Проверьте ссылку или попросите новую.",closed:"Это интервью закрыто.",name:"Как вас зовут?",namePh:"Имя (необязательно)",
    chip1:"Один вопрос за раз",finishing:"Сохраняю…",resume:"Вы можете закрыть страницу и вернуться позже по той же ссылке в этом браузере."},
  en:{you:"You",ai:"Interviewer",start:"Start interview",send:"Send",finish:"Finish interview",coverage:"Show coverage",
    placeholder:"Answer in your own words. Dictation is fine.",intro:"This is a preparation interview for your video's script. I ask one short question at a time and choose the next one from your answer. Answer however is easiest; rough wording is fine. It usually takes 20-30 minutes.",
    saved:"Answers save automatically",copy:"Copy answers",copied:"Copied",thinking:"Thinking about the next question…",
    done:"Thank you! The interview is complete and your answers are with the Velor team.",err:"Couldn't get a reply. Please try again in a minute.",
    retry:"Retry",micStart:"Dictate",micStop:"Stop",confirmFinish:"Finish the interview? You won't be able to continue later.",yes:"Yes, finish",no:"Keep going",
    missing:"No interview was found at this link. Check the link or ask for a new one.",closed:"This interview is closed.",name:"What's your name?",namePh:"Name (optional)",
    chip1:"One question at a time",finishing:"Saving…",resume:"You can close this page and come back later via the same link in this browser."}
};

const view=document.getElementById("view");
function el(tag,attrs,...kids){const n=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")n.className=attrs[k];else if(k==="text")n.textContent=attrs[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),attrs[k]);else n.setAttribute(k,attrs[k]);}for(const c of kids){if(c==null)continue;n.append(c.nodeType?c:document.createTextNode(String(c)));}return n;}
function clear(){view.replaceChildren();}
function card(...k){return el("section",{class:"card"},...k);}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function rid(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,"0")).join("");}
function transcriptText(msgs){let n=0;return msgs.map(m=>m.role==="assistant"?("Q: "+m.content):("A"+(++n)+": "+m.content)).join("\n\n");}
async function copyText(btn,text,label){try{await navigator.clipboard.writeText(text);const o=btn.textContent;btn.textContent=label||"Скопировано";setTimeout(()=>btn.textContent=o,1500);}catch(e){btn.textContent="Не скопировалось";}}
async function api(path,opts){const r=await fetch(path,opts);let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||("http_"+r.status)),{status:r.status});return j;}

// ---------- routing ----------
const path=location.pathname.replace(/\/+$/,"");
if(path==="/admin") renderAdmin();
else{
  const m=path.match(/^\/(?:i\/)?([a-z0-9-]{2,64})$/);
  const hashId=(location.hash||"").replace(/^#/,"");
  const id=m?m[1]:(hashId||"");
  if(id) renderInterviewPage(id);
  else{clear();view.append(card(el("h1",{text:"Velor Interview"}),el("p",{class:"lede",text:"Откройте персональную ссылку на интервью, которую вам прислала команда Velor. / Open the personal interview link the Velor team sent you."})));}
}

// ---------- interview ----------
let L=T.ru,brief=null,briefId="",sid="",session={messages:[],status:"new"},busy=false;
let feedEl,inputEl,sendBtn,finishBtn,covBtn,micBtn,composerEl,copyBtn,retryEl=null;

async function renderInterviewPage(id){
  briefId=id;
  try{brief=await api("/api/brief?id="+encodeURIComponent(id));}
  catch(e){clear();view.append(card(el("p",{text:T.ru.missing+" / "+T.en.missing})));return;}
  L=T[brief.lang==="en"?"en":"ru"]; document.documentElement.lang=brief.lang==="en"?"en":"ru";
  document.getElementById("hdrSub").textContent=brief.lang==="en"?"Interview":"Интервью";
  if(!brief.active){clear();view.append(card(el("p",{text:L.closed})));return;}
  sid=lsGet("velor-sid-"+id); if(!sid){sid=rid();lsSet("velor-sid-"+id,sid);}
  try{session=await api(`/api/session?b=${id}&s=${sid}`);}catch(e){session={messages:[],status:"new"};}
  renderInterview();
}
function renderInterview(){
  clear();
  const head=card(el("h1",{text:brief.title||"Interview"}),el("p",{class:"lede",text:brief.intro||L.intro}),
    el("div",{class:"meta"},el("span",{class:"chip gold",text:L.chip1}),el("span",{class:"chip",text:"20-30 min"}),
      session.status==="done"?el("span",{class:"chip ok",text:brief.lang==="en"?"Finished":"Завершено"}):null));
  feedEl=el("div",{class:"feed","aria-live":"polite"});
  view.append(head,feedEl);
  for(const m of session.messages||[]) addMsg(m.role,m.content,false);
  if(session.status==="done"){renderDone();return;}
  if(!(session.messages||[]).length){
    const nameIn=el("input",{type:"text",id:"pName",placeholder:L.namePh,autocomplete:"name"});
    const startBtn=el("button",{class:"btn primary",type:"button",text:L.start,onclick:async()=>{
      startBtn.disabled=true;nameIn.disabled=true;
      const ok=await askNext({name:nameIn.value.trim()});
      if(ok){startWrap.remove();buildComposer();}else{startBtn.disabled=false;nameIn.disabled=false;}
    }});
    const startWrap=card(el("label",{for:"pName",text:L.name}),nameIn,el("div",{style:"margin-top:14px"},startBtn),el("p",{class:"note",text:L.resume}));
    view.append(startWrap); return;
  }
  buildComposer();
  if(session.messages[session.messages.length-1].role==="user") showRetry();
}
function addMsg(role,text,scroll=true){
  const n=el("div",{class:"msg "+(role==="assistant"?"ai":"me")},el("span",{class:"who",text:role==="assistant"?L.ai:L.you}),text);
  feedEl.append(n); if(scroll) n.scrollIntoView({behavior:"smooth",block:"end"}); return n;
}
function buildComposer(){
  inputEl=el("textarea",{id:"answer",placeholder:L.placeholder,rows:"2","aria-label":L.placeholder});
  inputEl.addEventListener("input",()=>{inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,220)+"px";lsSet("velor-draft-"+briefId,inputEl.value);});
  inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();submit();}});
  const draft=lsGet("velor-draft-"+briefId); if(typeof draft==="string") inputEl.value=draft;
  sendBtn=el("button",{class:"btn primary",type:"button",text:L.send,onclick:submit});
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  micBtn=SR?el("button",{class:"btn mic",type:"button",text:L.micStart,onclick:toggleMic}):null;
  covBtn=el("button",{class:"btn ghost",type:"button",text:L.coverage,onclick:()=>{inputEl.value=L.coverage;submit();}});
  finishBtn=el("button",{class:"btn ghost",type:"button",text:L.finish,onclick:confirmFinish});
  copyBtn=el("button",{class:"btn ghost",type:"button",text:L.copy,onclick:()=>copyText(copyBtn,transcriptText(session.messages),L.copied)});
  composerEl=el("div",{class:"composer"},
    el("div",{class:"box"},inputEl,micBtn,sendBtn),
    el("div",{class:"row"},el("div",{class:"left"},covBtn,finishBtn,copyBtn),el("div",{class:"right"},el("span",{class:"status",text:L.saved}))));
  view.append(composerEl);
}
let rec=null,listening=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return;
  if(listening&&rec){rec.stop();return;}
  rec=new SR(); rec.lang=brief.lang==="en"?"en-US":"ru-RU"; rec.continuous=true; rec.interimResults=true;
  const base=inputEl.value?inputEl.value.replace(/\s*$/," "):""; let finalText=base;
  rec.onresult=(ev)=>{let interim="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)finalText+=r[0].transcript+" ";else interim+=r[0].transcript;}inputEl.value=finalText+interim;lsSet("velor-draft-"+briefId,inputEl.value);};
  rec.onstart=()=>{listening=true;micBtn.textContent=L.micStop;micBtn.classList.add("on");};
  rec.onend=()=>{listening=false;micBtn.textContent=L.micStart;micBtn.classList.remove("on");};
  rec.onerror=()=>{};
  try{rec.start();}catch(e){}
}
async function submit(){
  if(busy)return; const text=(inputEl.value||"").trim(); if(!text)return;
  if(listening&&rec){try{rec.stop();}catch(e){}}
  addMsg("user",text); inputEl.value=""; inputEl.style.height="auto"; lsSet("velor-draft-"+briefId,"");
  session.messages.push({role:"user",content:text});
  await askNext({text});
}
function showRetry(){
  if(retryEl)retryEl.remove();
  retryEl=el("div",{class:"row"},el("span",{class:"status",text:L.err}),el("button",{class:"btn",type:"button",text:L.retry,onclick:()=>{retryEl.remove();retryEl=null;askNext({});}}));
  feedEl.after(retryEl);
}
async function askNext(payload){
  busy=true; setControls(false);
  const tip=el("div",{class:"msg ai"},el("span",{class:"who",text:L.ai}),el("span",{class:"typing",text:L.thinking}));
  feedEl.append(tip); tip.scrollIntoView({behavior:"smooth",block:"end"});
  let ok=false;
  try{
    const r=await api("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({b:briefId,s:sid,...payload})});
    tip.lastChild.className=""; tip.lastChild.textContent=r.reply;
    session.messages=r.messages; ok=true;
  }catch(e){tip.remove();showRetry();}
  busy=false; setControls(true); if(inputEl)inputEl.focus();
  return ok;
}
function setControls(on){[sendBtn,finishBtn,covBtn,micBtn].forEach(b=>{if(b)b.disabled=!on;});}
function confirmFinish(){
  if(busy)return;
  const bar=card(el("p",{text:L.confirmFinish}),
    el("div",{class:"row"},el("div",{class:"left"},
      el("button",{class:"btn primary",type:"button",text:L.yes,onclick:async(ev)=>{ev.target.disabled=true;ev.target.textContent=L.finishing;await finish();bar.remove();}}),
      el("button",{class:"btn",type:"button",text:L.no,onclick:()=>bar.remove()}))));
  composerEl.before(bar); bar.scrollIntoView({behavior:"smooth",block:"center"});
}
async function finish(){
  busy=true; setControls(false);
  try{await api("/api/finish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({b:briefId,s:sid})});}catch(e){}
  session.status="done"; composerEl.remove(); renderDone(); busy=false;
}
function renderDone(){
  const cp=el("button",{class:"btn",type:"button",text:L.copy,onclick:()=>copyText(cp,transcriptText(session.messages),L.copied)});
  view.append(card(el("p",{text:L.done}),el("div",{class:"row"},el("div",{class:"left"},cp))));
}

// ---------- admin ----------
let adminKey="";
function adminHeaders(){return {"Content-Type":"application/json","x-admin-key":adminKey};}
async function renderAdmin(){
  document.getElementById("hdrSub").textContent="Панель интервью";
  adminKey=lsGet("velor-admin")||"";
  if(adminKey){try{await api("/api/admin?op=ping",{headers:adminHeaders()});return renderPanel();}catch(e){adminKey="";}}
  clear();
  const pw=el("input",{type:"password",id:"aPw",placeholder:"Пароль панели",autocomplete:"current-password"});
  const msg=el("p",{class:"note"});
  const go=el("button",{class:"btn primary",type:"button",text:"Войти",onclick:async()=>{
    adminKey=pw.value; try{await api("/api/admin?op=ping",{headers:adminHeaders()});lsSet("velor-admin",adminKey);renderPanel();}
    catch(e){msg.textContent=e.message==="admin_password_not_set"?"Пароль панели ещё не задан в настройках хостинга.":"Неверный пароль.";}
  }});
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")go.click();});
  view.append(card(el("h1",{text:"Вход в панель"}),el("label",{for:"aPw",text:"Пароль"}),pw,el("div",{style:"margin-top:12px"},go),msg));
}
async function renderPanel(){
  clear();
  const intro=card(el("h1",{text:"Интервью для сценариев"}),
    el("p",{class:"lede",text:"Создайте бриф, скопируйте ссылку и отправьте её клиенту. Аккаунт клиенту не нужен. Ответы и итоговая выжимка появятся у брифа."}));
  const list=el("div",{class:"list"},el("p",{class:"note",text:"Загружаю…"}));
  view.append(intro,card(el("h2",{text:"Брифы"}),list),buildBriefForm(),
    el("div",{},el("button",{class:"btn ghost",type:"button",text:"Выйти",onclick:()=>{lsSet("velor-admin","");location.reload();}})));
  try{
    const {briefs}=await api("/api/admin?op=briefs",{headers:adminHeaders()});
    list.replaceChildren();
    if(!briefs.length) list.append(el("p",{class:"note",text:"Пока нет брифов. Создайте первый ниже."}));
    for(const b of briefs){
      const link=location.origin+"/"+b.id;
      const cbtn=el("button",{class:"btn",type:"button",text:"Скопировать ссылку",onclick:()=>copyText(cbtn,link)});
      const tog=el("button",{class:"btn ghost",type:"button",text:b.active===false?"Открыть":"Закрыть",onclick:async()=>{await api("/api/admin",{method:"POST",headers:adminHeaders(),body:JSON.stringify({op:"update",id:b.id,active:b.active===false})});renderPanel();}});
      const sessBox=el("div",{});
      const showS=el("button",{class:"btn ghost",type:"button",text:"Ответы ("+b.sessions+")",onclick:()=>loadSessions(b,sessBox)});
      list.append(el("div",{class:"item"},
        el("div",{},el("div",{class:"t",text:b.title}),el("div",{class:"s",text:(b.lang==="en"?"EN":"RU")+" · "+link+(b.active===false?" · закрыт":"")})),
        el("div",{class:"left"},cbtn,showS,tog)), sessBox);
    }
  }catch(e){list.replaceChildren(el("p",{class:"note",text:"Не получилось загрузить брифы: "+e.message}));}
}
async function loadSessions(b,box){
  box.replaceChildren(el("p",{class:"note",text:"Загружаю ответы…"}));
  try{
    const {sessions}=await api("/api/admin?op=sessions&b="+b.id,{headers:adminHeaders()});
    box.replaceChildren();
    if(!sessions.length){box.append(el("p",{class:"note",text:"Пока никто не отвечал."}));return;}
    for(const s of sessions){
      const answers=(s.messages||[]).filter(m=>m.role==="user").length;
      const st=s.status==="done"?el("span",{class:"chip ok",text:"завершено"}):el("span",{class:"chip warn",text:"в процессе"});
      const c1=el("button",{class:"btn",type:"button",text:"Скопировать транскрипт",onclick:()=>copyText(c1,s.transcript)});
      const c2=s.handoff?el("button",{class:"btn",type:"button",text:"Скопировать выжимку",onclick:()=>copyText(c2,s.handoff)}):null;
      const pre=el("pre",{class:"tx",text:s.handoff||""}); if(!s.handoff)pre.classList.add("hidden");
      const gen=el("button",{class:"btn ghost",type:"button",text:s.handoff?"Пересобрать выжимку":"Собрать выжимку",onclick:async()=>{
        gen.disabled=true;gen.textContent="Собираю…";
        try{const r=await api("/api/admin",{method:"POST",headers:adminHeaders(),body:JSON.stringify({op:"handoff",b:b.id,s:s.sid})});pre.textContent=r.handoff;pre.classList.remove("hidden");gen.textContent="Готово";}
        catch(e){gen.textContent="Ошибка: "+e.message;gen.disabled=false;}
      }});
      box.append(el("details",{},el("summary",{},(s.name||"Участник "+s.sid.slice(0,6))+" · ответов: "+answers+" "),st,
        el("div",{class:"row",style:"margin:10px 0"},el("div",{class:"left"},c1,c2,gen)), pre, el("pre",{class:"tx",text:s.transcript||"Пусто"})));
    }
  }catch(e){box.replaceChildren(el("p",{class:"note",text:"Не получилось загрузить ответы: "+e.message}));}
}
function buildBriefForm(){
  const title=el("input",{type:"text",id:"bTitle",placeholder:"Например: TradePilot, видео 3"});
  const slugIn=el("input",{type:"text",id:"bSlug",placeholder:"tradepilot-3 (латиница, необязательно)"});
  const lang=el("select",{id:"bLang"},el("option",{value:"ru",text:"Русский"}),el("option",{value:"en",text:"English"}));
  const intro=el("textarea",{class:"field",id:"bIntro",style:"min-height:80px",placeholder:"Короткое приветствие для клиента (необязательно)"});
  const ctx=el("textarea",{class:"field",id:"bCtx",placeholder:"Для кого видео, обещание, Big Idea, структура, что уже известно и что нужно узнать у эксперта."});
  const msg=el("p",{class:"note"});
  const save=el("button",{class:"btn primary",type:"button",text:"Создать бриф",onclick:async()=>{
    if(!title.value.trim()||!ctx.value.trim()){msg.textContent="Заполните название и контекст.";return;}
    save.disabled=true;
    try{const r=await api("/api/admin",{method:"POST",headers:adminHeaders(),body:JSON.stringify({op:"create",title:title.value,id:slugIn.value,lang:lang.value,intro:intro.value,context:ctx.value})});msg.textContent="Готово: "+location.origin+"/"+r.id;renderPanel();}
    catch(e){msg.textContent="Не сохранилось: "+e.message;save.disabled=false;}
  }});
  return card(el("h2",{text:"Новый бриф"}),
    el("label",{for:"bTitle",text:"Название интервью"}),title,
    el("label",{for:"bSlug",text:"Адрес ссылки"}),slugIn,
    el("label",{for:"bLang",text:"Язык интервью"}),lang,
    el("label",{for:"bIntro",text:"Приветствие"}),intro,
    el("label",{for:"bCtx",text:"Контекст для интервьюера"}),ctx,
    el("div",{class:"row",style:"margin-top:12px"},el("div",{class:"left"},save),msg));
}
})();
</script>
